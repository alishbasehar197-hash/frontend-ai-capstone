<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Frontend AI Capstone</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-heading">
      <header class="login-header">
        <h1 id="login-heading">Welcome back</h1>
        <p>Sign in to your account</p>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
          <span class="error-message" id="email-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="toggle-password"
              id="toggle-password"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
          <span class="error-message" id="password-error" role="alert"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign in</button>

        <p class="success-message" id="success-message" role="status" hidden></p>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
